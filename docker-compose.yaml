version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_service
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: mongo_service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: backend_cluster
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo_service:27017/url_shortener
      - REDIS_URL=redis://redis_service:6379
    depends_on:
      - redis
      - mongodb
    ports:
      - "8181:8181"
      - "8182:8182"
      - "8183:8183"
      - "8184:8184"
      - "8185:8185"

  nginx:
    image: nginx:alpine
    container_name: nginx_lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data: